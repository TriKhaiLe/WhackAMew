<!DOCTYPE html>
<html>
<head>
    <title>Game Đập Chuột</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="start-screen" class="start-screen">
            <h1>Game Đập Chuột</h1>
            <button id="start-button">Bắt đầu chơi</button>
        </div>
        <div class="score-board">
            Điểm: <span id="score">0</span>
            <div class="timer">Thời gian: <span id="time">15</span>s</div>
        </div>
        <div class="game-board">
            <!-- Các ô game sẽ được tạo bằng JavaScript -->
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
